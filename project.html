<script>
  /* Phone gate — runs before the first paint. On a phone (at most 768px wide, or a touch
     screen at most 500px tall: a phone on its side) the site becomes its app version: a
     screen per tab and a bar at the bottom (app.css, js/app.js), opening on the tab the
     address names (#home, #works, #cv, #contact; the old anchors lead to theirs) */
  (function () {
    var root = document.documentElement;
    if (!window.matchMedia || !window.matchMedia("(max-width: 768px), (hover: none) and (pointer: coarse) and (max-height: 500px)").matches) return;
    var tabs = { works: "works", work: "works", projects: "works", events: "works", cv: "cv", contact: "contact" };
    root.classList.add("is-app");
    root.setAttribute("data-tab", "works");
  })();
</script>
